global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor - Docker container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8081']

  # PostgreSQL Exporter - Database metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # Elasticsearch
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']

  # Logstash
  - job_name: 'logstash'
    static_configs:
      - targets: ['logstash:9600']

  # Kibana
  - job_name: 'kibana'
    static_configs:
      - targets: ['kibana:5601']

  # Your application containers (update these based on your app)
  - job_name: 'kitchen-hand-app'
    static_configs:
      - targets: ['host.docker.internal:8080']  # Update port as needed
    scrape_interval: 30s
