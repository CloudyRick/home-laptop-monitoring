# Module: system
# Docs: https://www.elastic.co/guide/en/beats/filebeat/main/filebeat-module-system.html

- module: system
  # Syslog
  syslog:
    enabled: true
    var.paths:
      - /var/log/syslog
      - /var/lib/docker/containers/*/*.log

  # Authorization logs
  auth:
    enabled: true
    var.paths:
      - /var/log/auth.log
