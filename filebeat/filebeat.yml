filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: true
  
filebeat.inputs:
  # Docker container logs
  - type: container
    enabled: true
    paths:
      - '/var/lib/docker/containers/*/*.log'
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - add_fields:
          fields:
            log_type: docker

  # System logs
  - type: log
    enabled: true
    paths:
      - /var/log/syslog
      - /var/log/auth.log
      - /var/log/kern.log
    fields:
      log_type: system
    fields_under_root: true

  # PostgreSQL logs (adjust path based on your setup)
  - type: log
    enabled: true
    paths:
      - /var/log/postgresql/*.log
    fields:
      log_type: postgresql
    fields_under_root: true

  # Application logs (adjust path based on your app)
  - type: log
    enabled: true
    paths:
      - /var/log/your-app/*.log
    fields:
      log_type: application
    fields_under_root: true

output.logstash:
  hosts: ["logstash:5044"]

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
